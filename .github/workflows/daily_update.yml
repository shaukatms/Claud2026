name: Daily News Update

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news updater
        run: python3 auto_news_updater.py
        env:
          FREEHOSTIA_HOST: ${{ secrets.FREEHOSTIA_HOST }}
          FREEHOSTIA_USER: ${{ secrets.FREEHOSTIA_USER }}
          FREEHOSTIA_PASS: ${{ secrets.FREEHOSTIA_PASS }}

      - name: Commit and push updates
        run: |
          git config user.name "Student News Auto Bot"
          git config user.email "bot@studentnews.pk"
          git add -A
          git commit -m "Daily news update" || true
          git push
